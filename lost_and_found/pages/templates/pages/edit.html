{% extends "pages/base.html" %}

{% block content %}

<h1>Edit Item</h1>
<p style="color:#667085;">Update the details for this item.</p>

<section class="form-panel">
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-row">
        <div class="form-group">
            <label>Title *</label>
            <input type="text" name="title" value="{{ item.title }}" required>
        </div>
        <div class="form-group">
            <label>Status *</label>
            <select name="status">
                <option value="LOST" {% if item.status == "LOST" %}selected{% endif %}>LOST</option>
                <option value="FOUND" {% if item.status == "FOUND" %}selected{% endif %}>FOUND</option>
                <option value="RESOLVED" {% if item.status == "RESOLVED" %}selected{% endif %}>RESOLVED</option>
            </select>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Category</label>
            <select name="category">
                <option value="">Select a category</option>
                <option value="Electronics" {% if item.category == "Electronics" %}selected{% endif %}>Electronics</option>
                <option value="Jewelry" {% if item.category == "Jewelry" %}selected{% endif %}>Jewelry</option>
                <option value="Documents" {% if item.category == "Documents" %}selected{% endif %}>Documents</option>
                <option value="Clothing" {% if item.category == "Clothing" %}selected{% endif %}>Clothing</option>
                <option value="Keys" {% if item.category == "Keys" %}selected{% endif %}>Keys</option>
                <option value="Accessories" {% if item.category == "Accessories" %}selected{% endif %}>Accessories</option>
                <option value="Other" {% if item.category == "Other" %}selected{% endif %}>Other</option>
            </select>
        </div>
        <div class="form-group">
            <label>Location</label>
            <input type="text" name="location" value="{{ item.location }}">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Date</label>
            <input type="date" name="date" value="{{ item.date }}">
        </div>
        <div class="form-group">
            <label>Contact</label>
            <input type="text" name="contact" value="{{ item.contact }}">
        </div>
    </div>

    <div class="form-group" style="margin-bottom:16px;">
        <label>Description</label>
        <textarea name="description" rows="4">{{ item.description }}</textarea>
    </div>

    <div class="form-group" style="margin-bottom:16px;">
        <label>Image</label>
        {% if item.image %}
            <div style="margin-bottom:8px;"><img src="{{ item.image.url }}" alt="item image" style="max-height:160px;"/></div>
        {% endif %}
        <input type="file" name="image" accept="image/*">
    </div>

    <button type="submit" class="button blue-button">Save Changes</button>
    <a class="button" style="background:#eef1f6; color:#172033;" href="{% url 'detail' item_id %}">Cancel</a>
</form>
</section>

{% endblock %}
